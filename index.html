<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Extractor — Video to JPG</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --dim:#8b93a5;
    --accent:#ffb547; --accent2:#5ad1c4; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--accent);background:#1d2029}
  .drop b{color:var(--accent)}
  .drop input{display:none}
  .grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  video{width:100%;max-height:360px;background:#000;border-radius:10px;display:block}
  .meta{color:var(--dim);font-size:13px;margin-top:8px;word-break:break-all}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:.6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  input[type=number],select{width:100%;background:#0f1218;color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font-size:15px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .est{font-size:13px;color:var(--accent2);margin:4px 0 10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#232835;color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;font-size:15px;cursor:pointer;font-weight:600}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent)}
  button.teal{background:var(--accent2);color:#06201d;border-color:var(--accent2)}
  button.danger{color:var(--danger)}
  .bar{height:10px;background:#0f1218;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:12px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .1s}
  .status{font-size:13px;color:var(--dim);min-height:1.4em}
  .frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
  .frames figure{margin:0;position:relative;cursor:pointer;content-visibility:auto;contain-intrinsic-size:110px 70px}
  .frames img{width:100%;display:block;border-radius:6px;background:#000;aspect-ratio:16/9;object-fit:cover}
  .frames figcaption{position:absolute;left:4px;bottom:4px;font-size:10px;background:#000a;padding:1px 5px;border-radius:4px}
  .more{color:var(--dim);font-size:13px;margin-top:8px}
  .hide{display:none!important}
  .note{font-size:12px;color:var(--dim);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Frame <span>Extractor</span></h1>
    <div class="sub">Video → JPG frames, entirely in your browser. Nothing is uploaded.</div>
  </header>

  <div class="panel">
    <div class="drop" id="drop">
      <input type="file" id="file" accept="video/*">
      <div><b>Tap to choose a video</b> or drop one here</div>
      <div class="sub" style="margin-top:4px">MP4, MOV, WebM — anything your browser can play</div>
    </div>
  </div>

  <div class="grid2 hide" id="work">
    <div class="panel">
      <video id="video" controls muted playsinline preload="auto"></video>
      <div class="meta" id="meta"></div>
    </div>

    <div class="panel">
      <div class="row">
        <div>
          <label for="fps">Frames per second</label>
          <input type="number" id="fps" value="12" min="0.1" max="120" step="0.1">
        </div>
        <div>
          <label for="scale">Output size</label>
          <select id="scale">
            <option value="0">Original</option>
            <option value="3840">Max 3840 wide</option>
            <option value="1920">Max 1920 wide</option>
            <option value="1280">Max 1280 wide</option>
            <option value="720">Max 720 wide</option>
            <option value="480">Max 480 wide</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="start">Start (sec)</label>
          <input type="number" id="start" value="0" min="0" step="0.1">
        </div>
        <div>
          <label for="end">End (sec)</label>
          <input type="number" id="end" value="0" min="0" step="0.1">
        </div>
      </div>
      <label for="quality">JPG quality: <span id="qv">92</span>%</label>
      <input type="range" id="quality" min="40" max="100" value="92">
      <div class="est" id="est"></div>

      <div class="btns">
        <button class="primary" id="go">Extract frames</button>
        <button class="danger hide" id="stop">Stop</button>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div class="status" id="status">Ready.</div>

      <div class="btns" style="margin-top:10px">
        <button class="teal" id="zip" disabled>Download ZIP</button>
        <button id="folder" disabled class="hide">Save to folder…</button>
        <button id="clear" disabled>Clear</button>
      </div>
      <div class="note" id="saveNote"></div>
    </div>
  </div>

  <div class="panel hide" id="previewPanel">
    <div class="frames" id="frames"></div>
    <div class="more" id="more"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), fileInput = $('file'), drop = $('drop');
  const PREVIEW_LIMIT = 300;

  let srcURL = null, baseName = 'video', frames = [], abort = false, busy = false;
  let previewURLs = [];

  // ---------- File loading ----------
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer.files[0]; if (f) loadFile(f);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

  function loadFile(f) {
    if (busy) return;
    clearFrames();
    if (srcURL) URL.revokeObjectURL(srcURL);
    srcURL = URL.createObjectURL(f);
    baseName = f.name.replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '_') || 'video';
    video.src = srcURL;
    video.load();
    $('work').classList.remove('hide');
    $('meta').textContent = 'Loading ' + f.name + '…';
    setStatus('Loading video…');
  }

  video.addEventListener('loadedmetadata', async () => {
    let d = video.duration;
    // Some WebM files report Infinity until you seek to the end
    if (!isFinite(d)) {
      video.currentTime = 1e9;
      await once(video, 'seeked', 4000);
      d = video.duration;
      video.currentTime = 0;
    }
    $('start').value = 0;
    $('end').value = isFinite(d) ? d.toFixed(2) : 0;
    $('meta').textContent =
      `${video.videoWidth}×${video.videoHeight} · ${fmtTime(d)} · ${baseName}`;
    setStatus('Ready.');
    updateEstimate();
  });
  video.addEventListener('error', () => {
    setStatus('This browser can’t decode that video. Try converting it to MP4 (H.264).');
  });

  ['fps','start','end','scale'].forEach(id => $(id).addEventListener('input', updateEstimate));
  $('quality').addEventListener('input', () => $('qv').textContent = $('quality').value);

  function range() {
    const d = video.duration || 0;
    let s = Math.max(0, +$('start').value || 0);
    let e = +$('end').value || d;
    if (!isFinite(e) || e > d) e = d;
    return [s, Math.max(s, e)];
  }
  function frameCount() {
    const fps = +$('fps').value;
    const [s, e] = range();
    if (!(fps > 0)) return 0;
    return Math.max(1, Math.floor((e - s) * fps + 1e-6));
  }
  function outSize() {
    const max = +$('scale').value, w = video.videoWidth, h = video.videoHeight;
    if (!max || w <= max) return [w, h];
    return [max, Math.round(h * max / w)];
  }
  function updateEstimate() {
    if (!video.videoWidth) return;
    const n = frameCount(), [w, h] = outSize();
    $('est').textContent = `${n.toLocaleString()} frames at ${w}×${h}`;
  }

  // ---------- Extraction ----------
  $('go').addEventListener('click', extract);
  $('stop').addEventListener('click', () => { abort = true; });

  async function extract() {
    if (busy || !video.videoWidth) return;
    clearFrames();
    busy = true; abort = false;
    toggleUI(true);

    const fps = +$('fps').value;
    const [s] = range();
    const n = frameCount();
    const q = +$('quality').value / 100;
    const [w, h] = outSize();
    const pad = Math.max(5, String(n).length);

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { alpha: false });

    video.pause();
    const t0 = performance.now();

    for (let i = 0; i < n; i++) {
      if (abort) break;
      const t = s + i / fps;
      await seekTo(Math.min(t + 0.0005, video.duration - 0.001));
      ctx.drawImage(video, 0, 0, w, h);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
      const buf = new Uint8Array(await blob.arrayBuffer());
      const name = `${baseName}_${String(i + 1).padStart(pad, '0')}.jpg`;
      frames.push({ name, blob, crc: crc32(buf), size: buf.length, t });
      if (frames.length <= PREVIEW_LIMIT) addPreview(frames.length - 1);

      const pct = (i + 1) / n;
      $('prog').style.width = (pct * 100).toFixed(1) + '%';
      const el = (performance.now() - t0) / 1000;
      const eta = el / (i + 1) * (n - i - 1);
      setStatus(`Frame ${i + 1} / ${n} · ${fmtTime(t)} · ~${Math.ceil(eta)}s left`);
    }

    const total = frames.reduce((a, f) => a + f.size, 0);
    setStatus(`${abort ? 'Stopped. ' : 'Done! '}${frames.length.toLocaleString()} frames · ${fmtBytes(total)}`);
    $('more').textContent = frames.length > PREVIEW_LIMIT
      ? `Showing the first ${PREVIEW_LIMIT} of ${frames.length.toLocaleString()} frames (all are included in the download).` : '';
    busy = false;
    toggleUI(false);
  }

  function seekTo(t) {
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        video.removeEventListener('seeked', onSeek);
        // Give the decoder a moment to paint the new frame (helps Safari)
        if (video.requestVideoFrameCallback) {
          let fired = false;
          video.requestVideoFrameCallback(() => { fired = true; resolve(); });
          setTimeout(() => { if (!fired) resolve(); }, 120);
        } else {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        }
      };
      const onSeek = () => finish();
      video.addEventListener('seeked', onSeek);
      setTimeout(finish, 5000); // safety net
      video.currentTime = t;
    });
  }

  function once(el, ev, timeout) {
    return new Promise(r => {
      const h = () => { el.removeEventListener(ev, h); r(); };
      el.addEventListener(ev, h);
      setTimeout(h, timeout);
    });
  }

  // ---------- Preview ----------
  function addPreview(i) {
    $('previewPanel').classList.remove('hide');
    const f = frames[i];
    const url = URL.createObjectURL(f.blob);
    previewURLs.push(url);
    const fig = document.createElement('figure');
    fig.title = 'Tap to download ' + f.name;
    fig.innerHTML = `<img loading="lazy" src="${url}" alt=""><figcaption>${i + 1} · ${f.t.toFixed(2)}s</figcaption>`;
    fig.addEventListener('click', () => downloadBlob(f.blob, f.name));
    $('frames').appendChild(fig);
  }

  function clearFrames() {
    previewURLs.forEach(u => URL.revokeObjectURL(u));
    previewURLs = []; frames = [];
    $('frames').innerHTML = ''; $('more').textContent = '';
    $('previewPanel').classList.add('hide');
    $('prog').style.width = '0';
    $('saveNote').textContent = '';
    toggleUI(false);
  }
  $('clear').addEventListener('click', () => { clearFrames(); setStatus('Cleared.'); });

  // ---------- Saving: ZIP ----------
  $('zip').addEventListener('click', async () => {
    if (!frames.length) return;
    // Split into parts to stay under ZIP limits (65,535 files / 4 GB)
    const MAX_FILES = 60000, MAX_BYTES = 1.8e9;
    const parts = [];
    let cur = [], bytes = 0;
    for (const f of frames) {
      if (cur.length && (cur.length >= MAX_FILES || bytes + f.size > MAX_BYTES)) {
        parts.push(cur); cur = []; bytes = 0;
      }
      cur.push(f); bytes += f.size;
    }
    if (cur.length) parts.push(cur);

    for (let p = 0; p < parts.length; p++) {
      setStatus(`Building ZIP${parts.length > 1 ? ` part ${p + 1}/${parts.length}` : ''}…`);
      await new Promise(r => setTimeout(r, 30));
      const zipBlob = buildZip(parts[p]);
      const name = parts.length > 1 ? `${baseName}_frames_part${p + 1}.zip` : `${baseName}_frames.zip`;
      downloadBlob(zipBlob, name);
      await new Promise(r => setTimeout(r, 800));
    }
    setStatus(`ZIP ready — ${frames.length.toLocaleString()} JPGs.`);
  });

  // Minimal "stored" ZIP writer (JPGs are already compressed, so no deflate needed)
  function buildZip(list) {
    const enc = new TextEncoder();
    const chunks = [], central = [];
    let offset = 0;
    const { time, date } = dosDateTime(new Date());

    for (const f of list) {
      const nameBytes = enc.encode(f.name);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);      // UTF-8 names
      lh.setUint16(8, 0, true);           // stored
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, f.crc, true);
      lh.setUint32(18, f.size, true);
      lh.setUint32(22, f.size, true);
      lh.setUint16(26, nameBytes.length, true);
      lh.setUint16(28, 0, true);
      chunks.push(lh.buffer, nameBytes, f.blob);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, f.crc, true);
      ch.setUint32(20, f.size, true);
      ch.setUint32(24, f.size, true);
      ch.setUint16(28, nameBytes.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, nameBytes);

      offset += 30 + nameBytes.length + f.size;
    }
    const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, list.length, true);
    end.setUint16(10, list.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    return new Blob([...chunks, ...central, end.buffer], { type: 'application/zip' });
  }

  function dosDateTime(d) {
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
    };
  }

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // ---------- Saving: straight to a folder (Chrome/Edge desktop) ----------
  if ('showDirectoryPicker' in window) $('folder').classList.remove('hide');
  $('folder').addEventListener('click', async () => {
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch { return; }
    try {
      for (let i = 0; i < frames.length; i++) {
        const fh = await dir.getFileHandle(frames[i].name, { create: true });
        const w = await fh.createWritable();
        await w.write(frames[i].blob); await w.close();
        if (i % 10 === 0 || i === frames.length - 1)
          setStatus(`Saving ${i + 1} / ${frames.length} to “${dir.name}”…`);
      }
      setStatus(`Saved ${frames.length.toLocaleString()} JPGs to “${dir.name}”.`);
    } catch (err) {
      setStatus('Saving to folder failed: ' + err.message);
    }
  });

  // ---------- Helpers ----------
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  function toggleUI(running) {
    $('go').disabled = running;
    $('stop').classList.toggle('hide', !running);
    const has = !running && frames.length > 0;
    $('zip').disabled = !has; $('folder').disabled = !has; $('clear').disabled = !has;
    fileInput.disabled = running;
  }
  function setStatus(s) { $('status').textContent = s; }
  function fmtTime(s) {
    if (!isFinite(s)) return '?';
    const m = Math.floor(s / 60), sec = (s % 60).toFixed(2).padStart(5, '0');
    return `${m}:${sec}`;
  }
  function fmtBytes(b) {
    return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : (b / 1e3).toFixed(0) + ' KB';
  }
})();
</script>
</body>
</html>
